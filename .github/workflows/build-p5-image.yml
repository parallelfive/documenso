name: Build P5 Documenso Image

# Builds and publishes the parallelfive/documenso fork's custom image to GHCR.
# Pattern matches our parallelfive/coolify fork — see ~/parallel5/coolify
# for the precedent.
#
# Architecture: matrix-of-native-runners + manifest-merge.
#   - amd64 builds on `ubuntu-latest` (x86_64 GHA hosted runner)
#   - arm64 builds on `ubuntu-24.04-arm` (free for public repos as of 2026)
#   - both run in parallel, push digest-only images, then a `merge` job
#     stitches them into a multi-platform manifest under :latest + :<sha>.
# This replaces the previous QEMU-emulation single-job pattern, which took
# ~50 min wall clock for the arm64 slice. Native runners cut total wall
# clock to ~6 min (the time of a single arch build).
# Reference: https://docs.docker.com/build/ci/github-actions/multi-platform/
#
# Triggers:
#   - push to p5/patched: rebuild on every patch commit
#   - weekly cron: refresh mutable base-image layers used by the source build
#     (upstream source changes still require an intentional p5/patched rebase)
#   - manual dispatch: ad-hoc rebuild
#
# Output: ghcr.io/parallelfive/documenso:latest + per-SHA tag
# Pulled by: Coolify Service Stack on sign.parallel5.com

on:
  push:
    branches: [p5/patched]
  schedule:
    - cron: '0 6 * * 1'    # Mondays 06:00 UTC — refresh mutable base-image layers
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: parallelfive/documenso

jobs:
  startup-contract:
    # Keep the production entrypoint fail-closed before spending runner time
    # building either architecture.
    if: github.repository == 'parallelfive/documenso'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p5/patched

      - name: Verify fail-closed production startup
        run: |
          sh -n docker/start.sh
          sh -n docker/start.test.sh
          sh docker/start.test.sh

  build:
    # Guard: only run on the fork, never if someone re-imports this workflow
    # into upstream. Belt-and-suspenders since the file lives only on
    # p5/patched, but cheap insurance against accidental upstream rebase.
    if: github.repository == 'parallelfive/documenso'
    needs: startup-contract
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    # Native runner per platform — no QEMU emulation. ubuntu-24.04-arm is
    # a free GHA hosted runner on public repos.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: p5/patched

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Build from source via upstream's docker/Dockerfile — Node/TS
          # forks can't overlay files onto a prebuilt image (see the
          # Dockerfile.p5 docstring for why). Our patches live in the
          # source tree at apps/, packages/, and docker/, not as overlay
          # COPY lines.
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # Push as a digest-only image; the merge job stitches them into
          # a multi-platform manifest under the human-readable tags.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Per-platform cache scope — the two parallel jobs would clobber
          # each other on a single shared scope.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.repository == 'parallelfive/documenso'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
