name: Build P5 Documenso Image

# Builds and publishes the parallelfive/documenso fork's custom image to GHCR.
# Pattern matches our parallelfive/coolify fork — see ~/parallel5/coolify
# for the precedent.
#
# Triggers:
#   - push to p5/patched: rebuild on every patch commit
#   - weekly cron: pick up upstream base image (`documenso/documenso:latest`)
#     and apply our patches on top
#   - manual dispatch: ad-hoc rebuild
#
# Output: ghcr.io/parallelfive/documenso:latest + per-SHA tag
# Pulled by: Coolify Service Stack on sign.parallel5.com

on:
  push:
    branches: [p5/patched]
  schedule:
    - cron: '0 6 * * 1'    # Mondays 06:00 UTC — pick up new upstream base image
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: parallelfive/documenso

jobs:
  build-and-push:
    # Guard: only run on the fork, never if someone re-imports this workflow
    # into upstream. Belt-and-suspenders since the file lives only on
    # p5/patched, but cheap insurance against accidental upstream rebase.
    if: github.repository == 'parallelfive/documenso'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: p5/patched

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU is required for cross-platform builds — buildx can target
      # linux/arm64 from an amd64 runner via emulation. Same setup the
      # parallelfive/coolify fork uses.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Build from source via upstream's docker/Dockerfile — Node/TS
          # forks can't overlay files onto a prebuilt image (see the
          # Dockerfile.p5 docstring for why). Our patches live in the
          # source tree at apps/ + packages/, not as overlay COPY lines.
          file: docker/Dockerfile
          # Multi-arch — amd64 for prod's Coolify host (Linux x86_64) +
          # arm64 so Apple Silicon can pull this image straight into
          # local-dev docker compose without falling back to upstream
          # documenso/documenso. See biz-buddy's docker-compose.dev.yml
          # comment block for the constraint this unblocks.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
