name: Build P5 Documenso Image

# Builds and publishes the parallelfive/documenso fork's custom image to GHCR.
# Pattern matches our parallelfive/coolify fork — see ~/parallel5/coolify
# for the precedent.
#
# Triggers:
#   - push to p5/patched: rebuild on every patch commit
#   - weekly cron: pick up upstream base image (`documenso/documenso:latest`)
#     and apply our patches on top
#   - manual dispatch: ad-hoc rebuild
#
# Output: ghcr.io/parallelfive/documenso:latest + per-SHA tag
# Pulled by: Coolify Service Stack on sign.parallel5.com

on:
  push:
    branches: [p5/patched]
  schedule:
    - cron: '0 6 * * 1'    # Mondays 06:00 UTC — pick up new upstream base image
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: parallelfive/documenso

jobs:
  build-and-push:
    # Guard: only run on the fork, never if someone re-imports this workflow
    # into upstream. Belt-and-suspenders since the file lives only on
    # p5/patched, but cheap insurance against accidental upstream rebase.
    if: github.repository == 'parallelfive/documenso'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: p5/patched

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.p5
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
